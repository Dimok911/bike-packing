name: Manufacturer catalog scan

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
    inputs:
      review_report_path:
        description: "Committed checked report to import instead of running a live scan"
        required: false
        type: string
  push:
    branches:
      - experiment/frontend
    paths:
      - ".github/workflows/manufacturer-catalog-scan.yml"
      - "scripts/build-manufacturer-catalog.mjs"
      - "scripts/scan-manufacturer-catalog.mjs"
      - "scripts/publish-manufacturer-catalog-scan.mjs"
      - "scripts/manufacturer-catalog/**"
      - "src/data/manufacturer-catalog-scan.js"
      - "src/data/manufacturer-catalog-sources.js"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scan official manufacturer catalogs
        if: github.event_name != 'workflow_dispatch' || inputs.review_report_path == ''
        run: node scripts/scan-manufacturer-catalog.mjs --output manufacturer-catalog-scan.json --markdown manufacturer-catalog-scan.md --work-dir manufacturer-catalog-scan-work
      - name: Download official image snapshot
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.review_report_path == '')
        run: node scripts/download-manufacturer-catalog-images.mjs --manifest manufacturer-catalog-scan-work/manufacturer-catalog-images.json --root manufacturer-catalog-scan-snapshot
      - name: Validate checked review report
        if: github.event_name == 'workflow_dispatch' && inputs.review_report_path != ''
        env:
          REVIEW_REPORT_PATH: ${{ inputs.review_report_path }}
        run: |
          node scripts/validate-manufacturer-catalog-import.mjs "$REVIEW_REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          cp "$REVIEW_REPORT_PATH" manufacturer-catalog-scan.json
      - name: Add scan summary
        if: github.event_name != 'workflow_dispatch' || inputs.review_report_path == ''
        run: test -f manufacturer-catalog-scan.md && cat manufacturer-catalog-scan.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Store review artifact
        if: github.event_name != 'workflow_dispatch' || inputs.review_report_path == ''
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-catalog-scan
          path: |
            manufacturer-catalog-scan.json
            manufacturer-catalog-scan.md
            manufacturer-catalog-scan-work/manufacturer-bag-catalog.generated.mjs
            manufacturer-catalog-scan-work/manufacturer-catalog-images.json
            manufacturer-catalog-scan-work/tailfin-shop.html
            manufacturer-catalog-scan-work/.catalog-pages/tailfin
            manufacturer-catalog-scan-work/apidura-product-sitemap.xml
            manufacturer-catalog-scan-work/.catalog-pages/apidura
            manufacturer-catalog-scan-work/restrap-*.json
            manufacturer-catalog-scan-work/.catalog-pages/restrap
            manufacturer-catalog-scan-work/revelate-product-chart.html
            manufacturer-catalog-scan-work/.catalog-pages/revelate-designs
            manufacturer-catalog-scan-work/cyclite-bikepacking.html
            manufacturer-catalog-scan-work/.catalog-pages/cyclite
            manufacturer-catalog-scan-work/blackburn-bags.html
            manufacturer-catalog-scan-work/.catalog-pages/blackburn
            manufacturer-catalog-scan-work/topeak-bags.html
            manufacturer-catalog-scan-work/.catalog-pages/topeak
          if-no-files-found: error
          retention-days: 90
      - name: Store short-lived official image snapshot
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.review_report_path == '')
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-catalog-scan-images
          path: |
            manufacturer-catalog-scan-snapshot/assets/manufacturer-catalog
            manufacturer-catalog-scan-snapshot/manufacturer-catalog-image-download.json
          if-no-files-found: error
          retention-days: 14
      - name: Store checked import artifact
        if: github.event_name == 'workflow_dispatch' && inputs.review_report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-catalog-checked-import
          path: manufacturer-catalog-scan.json
          if-no-files-found: error
          retention-days: 90
      - name: Send report to catalog review API
        env:
          CATALOG_SCAN_API_URL: ${{ secrets.CATALOG_SCAN_API_URL }}
          CATALOG_SCAN_API_TOKEN: ${{ secrets.CATALOG_SCAN_API_TOKEN }}
        run: node scripts/publish-manufacturer-catalog-scan.mjs manufacturer-catalog-scan.json
