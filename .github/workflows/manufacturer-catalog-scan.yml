name: Manufacturer catalog scan

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
  push:
    branches:
      - codex/experiment-auth-photo-scroll-v1582
    paths:
      - ".github/workflows/manufacturer-catalog-scan.yml"
      - "scripts/build-manufacturer-catalog.mjs"
      - "scripts/scan-manufacturer-catalog.mjs"
      - "scripts/manufacturer-catalog/**"
      - "src/data/manufacturer-catalog-scan.js"
      - "src/data/manufacturer-catalog-sources.js"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scan official manufacturer catalogs
        run: node scripts/scan-manufacturer-catalog.mjs --output manufacturer-catalog-scan.json --markdown manufacturer-catalog-scan.md --work-dir manufacturer-catalog-scan-work
      - name: Download official image snapshot
        run: node scripts/download-manufacturer-catalog-images.mjs --manifest manufacturer-catalog-scan-work/manufacturer-catalog-images.json --root manufacturer-catalog-scan-snapshot
      - name: Add scan summary
        if: always()
        run: test -f manufacturer-catalog-scan.md && cat manufacturer-catalog-scan.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Store review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-catalog-scan
          path: |
            manufacturer-catalog-scan.json
            manufacturer-catalog-scan.md
            manufacturer-catalog-scan-work/manufacturer-bag-catalog.generated.mjs
            manufacturer-catalog-scan-work/manufacturer-catalog-images.json
            manufacturer-catalog-scan-snapshot/assets/manufacturer-catalog
          if-no-files-found: error
          retention-days: 90
      - name: Send report to catalog review API
        env:
          CATALOG_SCAN_API_URL: ${{ secrets.CATALOG_SCAN_API_URL }}
          CATALOG_SCAN_API_TOKEN: ${{ secrets.CATALOG_SCAN_API_TOKEN }}
        run: node scripts/publish-manufacturer-catalog-scan.mjs manufacturer-catalog-scan.json
