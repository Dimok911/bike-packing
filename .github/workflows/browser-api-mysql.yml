name: Browser API MySQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-api-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=integration-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout current API
        uses: actions/checkout@v4
        with:
          repository: Dimok911/bikepacking-api
          ref: main
          path: .integration/bikepacking-api

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix .integration/bikepacking-api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, API and MySQL integration
        env:
          BIKE_PACKING_BROWSER_INTEGRATION_TEST: "1"
          BIKE_PACKING_API_DIR: .integration/bikepacking-api
          BIKE_PACKING_TEST_DB_HOST: 127.0.0.1
          BIKE_PACKING_TEST_DB_PORT: "3306"
          BIKE_PACKING_TEST_DB_USER: root
          BIKE_PACKING_TEST_DB_PASSWORD: integration-root
          BIKE_PACKING_TEST_DB_NAME: bikepacking_frontend_ci_test
        run: npm run test:integration:browser

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-api-mysql-logs
          path: test-results/browser-api-mysql/
          if-no-files-found: ignore
          retention-days: 7
