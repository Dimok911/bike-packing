name: Frontend quality

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      webkit_diagnostic:
        description: Compare Linux WebKit WPE and GTK on the same photo forms
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.webkit_diagnostic }}
    runs-on: ubuntu-latest
    # Keep each browser's full suite on an isolated runner: both projects
    # share test build paths and cannot safely run as concurrent workers.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-webkit]
    # A measured WebKit run spent 23 minutes installing system dependencies
    # and reached test 743/760 at the old 75-minute job limit. Keep individual
    # test timeouts unchanged and allow the full suite to report its result.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source checks
        run: npm run check

      - name: Critical contracts
        run: npm run test:critical

      - name: Experiment transport isolation
        run: npm run test:transport

      - name: Application publication preserves photos
        run: node --test tests/integration/experiment-application-deployment.test.js

      - name: Production build
        run: npm run build

      - name: Live Experiment API contract
        run: npm run check:live-api-contract

      - name: Install browsers
        # The Chromium project also contains files with an explicit iPhone
        # device override; those files select WebKit through defaultBrowserType.
        run: npx playwright install --with-deps ${{ matrix.browser == 'mobile-webkit' && 'webkit' || 'chromium webkit' }}

      - name: Browser smoke
        env:
          DEBUG: "pw:browser"
        run: |
          echo "BIKE_BROWSER_SMOKE_STARTED=$(date --iso-8601=seconds)" >> "$GITHUB_ENV"
          npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Collect Linux browser crash diagnostics
        if: always()
        run: |
          mkdir -p browser-diagnostics
          bash scripts/collect-linux-browser-diagnostics.sh > browser-diagnostics/linux-browser.txt 2>&1

      # Preserve failed first attempts even when a retry passes. The next
      # Playwright invocation replaces these reports and output directories.
      - name: Preserve browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ matrix.browser }}
          path: |
            browser-diagnostics/
            playwright-report/
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/attachments/browser-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Disabled owner forms with their parent imports enabled
        id: disabled_owner
        env:
          BIKE_PERSONAL_UI_MODES: "photo-edit"
          BIKE_PERSONAL_PUBLIC_IMPORT: "1"
          BIKE_PERSONAL_PUBLIC_CHOICE: "1"
          BIKE_PERSONAL_SERVER_IMPORT: "1"
        run: npm run test:e2e -- tests/e2e/personal-save-ui.spec.js --project=${{ matrix.browser }} --grep '(public|server) (atomic owner photo gate off|pending owner creation gate off)'

      - name: Preserve disabled owner form diagnostics
        if: always() && steps.disabled_owner.outcome != 'skipped' && steps.disabled_owner.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-disabled-owner-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7

  webkit-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.webkit_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        renderer: [wpe-headless, gtk-headed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Compare photo forms without retries
        env:
          DEBUG: "pw:browser"
          BIKE_PERSONAL_UI_MODES: "photo-edit"
          DIAGNOSTIC_RENDERER: ${{ matrix.renderer }}
        shell: bash
        run: |
          echo "BIKE_BROWSER_SMOKE_STARTED=$(date --iso-8601=seconds)" >> "$GITHUB_ENV"
          args=(tests/e2e/personal-save-ui.spec.js --project=mobile-webkit --grep 'composed item photo form preserves placement and availability \((create|move|quantity|unplace)\)' --repeat-each=5 --retries=0 --workers=1 --max-failures=3)
          if [[ "$DIAGNOSTIC_RENDERER" == gtk-headed ]]; then
            xvfb-run --auto-servernum npm run test:e2e -- "${args[@]}" --headed
          else
            npm run test:e2e -- "${args[@]}"
          fi
      - name: Collect Linux browser crash diagnostics
        if: always()
        run: |
          mkdir -p browser-diagnostics
          bash scripts/collect-linux-browser-diagnostics.sh > browser-diagnostics/linux-browser.txt 2>&1
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-diagnostic-${{ matrix.renderer }}
          path: |
            browser-diagnostics/
            playwright-report/
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/attachments/browser-*.json
          if-no-files-found: ignore
          retention-days: 7
