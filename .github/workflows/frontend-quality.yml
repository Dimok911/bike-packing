name: Frontend quality

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source checks
        run: npm run check

      - name: Critical contracts
        run: npm run test:critical

      - name: Production build
        run: npm run build

      - name: Live Experiment API contract
        run: npm run check:live-api-contract

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
