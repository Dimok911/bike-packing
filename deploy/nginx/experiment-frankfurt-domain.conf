server {
    listen 80;
    server_name api-eu.vniipo-help.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://api-eu.vniipo-help.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name api-eu.vniipo-help.ru;
    if ($vniipo_request_origin_ok = 0) { return 403; }
    if ($vniipo_preflight_method_ok = 0) { return 403; }
    if ($vniipo_preflight_headers_ok = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/vniipo-frankfurt-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vniipo-frankfurt-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/vniipo-domain-access.log vniipo_safe;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    client_max_body_size 25m;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse off;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 8s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vniipo-reject-upstream-redirects.conf;
    include /etc/nginx/snippets/vniipo-forward-headers.conf;
    # Preserve canonical prefix and the original browser Origin. Auth and Bike
    # remain on their existing isolated upstream routes; no cookie rewriting.
    proxy_set_header Host api.vniipo-help.ru;
    proxy_ssl_name api.vniipo-help.ru;
    location = / { root /var/www/vniipo-proxy-check; try_files /index.html =404; }
    location = /healthz { default_type application/json; return 200 '{"ok":true,"role":"frankfurt-domain-proxy","mode":"experiment-manual-route-v1"}'; }
    location ~* /internal(?:/|$) { return 404; }
    location = /experiment/letters-vniipo/api/bike-packing/capabilities {
        limit_except GET OPTIONS { deny all; }
        proxy_pass https://90.156.128.115;
        add_header X-Vniipo-Proxy-Target bike-packing-experiment always;
        add_header X-Vniipo-Proxy-Write-Gate enabled always;
        add_header Access-Control-Expose-Headers 'X-Vniipo-Proxy-Target, X-Vniipo-Proxy-Write-Gate' always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /experiment/letters-vniipo/api/auth/verify-magic-link {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 403; }
        proxy_pass https://90.156.128.115;
    }
    location /experiment/letters-vniipo/api/ { proxy_pass https://90.156.128.115; }
    # Retain anonymous diagnostics, without exposing generic writers.
    location = /letters-vniipo/api/bike-packing/capabilities {
        limit_except GET OPTIONS { deny all; }
        proxy_set_header Cookie "";
        include /etc/nginx/snippets/vniipo-forward-headers.conf;
        proxy_set_header Host api.vniipo-help.ru;
        proxy_hide_header Set-Cookie;
        proxy_pass https://90.156.128.115/experiment/letters-vniipo/api/bike-packing/capabilities;
    }
    location = /auth/me {
        limit_except GET OPTIONS { deny all; }
        proxy_pass https://90.156.128.115;
    }
    location / { return 404; }
}
